<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png">
  <title>JP Group of Industries | Coming Soon</title>
  
  <style>
    :root {
      --brand-gold: #d4af53;
      --dark-bg: #0f0f0f;
      --text-light: #f5f5f5;
      --text-muted: #aaaaaa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--dark-bg);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .content {
      text-align: center;
      max-width: 900px;
      width: 100%;
    }

    .logo-area {
      margin-bottom: 2.5rem;
    }

    .logo-img {
      max-width: 320px;
      width: 80%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 8px 25px rgba(212, 175, 83, 0.25));
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 6rem);
      margin-bottom: 1.5rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--brand-gold);
    }

    .subtitle {
      font-size: clamp(1.25rem, 4.2vw, 1.8rem);
      color: var(--text-muted);
      max-width: 760px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
    }

    footer {
      padding: 3rem 1rem 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      border-top: 1px solid rgba(212, 175, 83, 0.1);
    }

    @media (max-width: 480px) {
      .logo-img {
        max-width: 240px;
      }
      h1 {
        font-size: clamp(2.2rem, 9vw, 4rem);
      }
      .construction {
        font-size: 1.1rem;
        padding: 0.9rem 1.8rem;
      }
      .dot {
        width: 10px;
        height: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="content">

      <div class="logo-area">
        <img src="./assets/images/home-one/logo/logo-white.png" alt="JP Group of Industries" class="logo-img">
      </div>

      <h1>Coming Soon</h1>
      
      <p class="subtitle">
        Your trusted partner in aggregate mining, transportation and fast delivery services. Building stronger foundations <br> — launching soon.
      </p>

    </div>
  </div>

  <footer>
    © 2026 JP Group of Industries • Mining • Transport • Delivery
  </footer>

</body>
</html>
